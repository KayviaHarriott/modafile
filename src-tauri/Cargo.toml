[package]
name = "kilofile"
version = "1.0.0"
description = "File compression and conversion for macOS"
authors = ["KiloFile"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
